name: Build & Auto Release

on:
  push:
    # branches:
    #   - dev # 取消注释以限制分支

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ====== 新增：设置 Node.js v12.15.0 ======
      - name: Set up Node.js v12.15.0
        uses: actions/setup-node@v4
        with:
          node-version: '12.15.0'

      # ====== 新增：下载并解压 Nacos 1.4.2（如需要）======
      - name: Download and extract Nacos 1.4.2
        run: |
          wget https://github.com/alibaba/nacos/releases/download/1.4.2/nacos-server-1.4.2.tar.gz
          mkdir -p nacos
          tar -xzf nacos-server-1.4.2.tar.gz -C nacos --strip-components=1
          echo "Nacos extracted to ./nacos"

      # （可选）如果你的构建过程需要启动 Nacos，可以在这里加启动脚本
      # - name: Start Nacos (optional)
      #   run: |
      #     nohup ./nacos/bin/startup.sh -m standalone > nacos.log 2>&1 &
      #     sleep 20  # 等待启动

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -s .github/settings.xml clean package

      - name: List files in dist/
        run: ls -la dist/

      - name: Determine next version
        id: version
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')
          NEXT_VERSION="${CURRENT_VERSION}-dev-$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.DBAPI_SECRET }}
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git tag "${{ steps.version.outputs.NEXT_VERSION }}"
          git push origin "${{ steps.version.outputs.NEXT_VERSION }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.DBAPI_SECRET }}
        with:
          tag_name: ${{ steps.version.outputs.NEXT_VERSION }}
          release_name: Release ${{ steps.version.outputs.NEXT_VERSION }}
          draft: false
          prerelease: false

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.DBAPI_SECRET }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/dbapi-3.2.1-bin.tar.gz
          asset_name: dbapi-3.2.1-bin.tar.gz
          asset_content_type: application/gzip
